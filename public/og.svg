<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d78c"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#c9a84c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Flight contrail arc -->
  <path d="M -40 520 C 300 480, 700 380, 1240 140" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 18" opacity="0.55"/>
  <circle cx="1090" cy="208" r="7" fill="#f0d78c"/>
  <circle cx="1090" cy="208" r="16" fill="none" stroke="#f0d78c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Logo mark -->
  <g transform="translate(92,88)">
    <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#141414" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M32 13 L50.8 51 h-7 L32 26.4 20.2 51 H13.2 Z" fill="url(#gold)"/>
    <path d="M9 41 C 22 38, 38 31, 53 19" fill="none" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="5 4.4" opacity="0.9"/>
    <circle cx="53" cy="19" r="3.2" fill="#f0d78c"/>
  </g>
  <text x="176" y="133" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#f5f2e9" letter-spacing="1">Miles Expert</text>

  <!-- Headline -->
  <text x="92" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" fill="#f5f2e9" letter-spacing="-1">Your miles deserve</text>
  <text x="92" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600" fill="url(#gold)" letter-spacing="-1">a first-class seat.</text>

  <!-- Subline -->
  <text x="92" y="462" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#9a968c">Award search across Qantas, Velocity, KrisFlyer, Emirates, United &amp; LifeMiles —</text>
  <text x="92" y="500" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#9a968c">ranked by cents-per-point, with a guided redemption playbook.</text>

  <!-- Footer chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9a84c">
    <rect x="92" y="540" width="245" height="44" rx="22" fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
    <text x="118" y="568">Continuously refreshed</text>
    <rect x="357" y="540" width="212" height="44" rx="22" fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
    <text x="383" y="568">CPP intelligence</text>
    <rect x="589" y="540" width="248" height="44" rx="22" fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
    <text x="615" y="568">Concierge ticketing</text>
  </g>
</svg>
